<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPPY BIRHTDAY!!!</title>
    <link rel="stylesheet" href="assets/src/output.css">
    <link rel="icon" href="assets/img/cake.png" type="image" />
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single+Ink:wght@100..900&family=Pacifico&display=swap"
        rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        a[href="https://confettipage.com"] {
            display: none !important;
        }

        body {
            overflow: hidden;
        }

        .birthday-text {
            z-index: 5;
            font-size: 4rem;
            font-weight: bold;
            text-align: center;
            background: linear-gradient(90deg,
                    #ff0000,
                    #ff7f00,
                    #ffff00,
                    #00ff00,
                    #00ffff,
                    #0000ff,
                    #8b00ff,
                    #ff00ff,
                    #ff0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 1000% 100%;
            animation: smooth-rainbow 15s linear infinite, pop 2s ease-in-out infinite alternate;
            margin-top: 50px;
            filter: drop-shadow(10px 10px 50px rgba(66, 0, 66, 0.6)) drop-shadow(10px 10px 90px rgba(0, 71, 71, 0.5));
        }

        .balloon {
            position: absolute;
            bottom: -200px;
            width: 120px;
            height: auto;
            animation: floatUp 10s linear infinite;
            user-select: none;
            -webkit-user-drag: none;
            cursor: pointer;
        }

        .balloon.pop {
            animation: popBalloon 0.4s ease-out forwards;
        }

        /* confetti particles */
        .confetti {
            position: absolute;
            width: 6px;
            height: 6px;
            background: red;
            border-radius: 50%;
            opacity: 0.8;
            animation: fallConfetti 0.7s ease-out forwards;
        }

        /* floating stars */
        .star {
            position: absolute;
            color: gold;
            font-size: 50px;
            animation: twinkle 3s infinite ease-in-out alternate;
        }

        .gif-image {
            position: fixed;
            width: 150px;
            height: auto;
            opacity: 0;
            z-index: 2;
            /* behind Happy Birthday text but above background */
            animation: fadeInGif 1.5s ease forwards;
            pointer-events: none;
            /* avoid blocking clicks on balloons */
        }

        @keyframes fadeInGif {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes smooth-rainbow {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 100% 50%;
            }
        }

        @keyframes pop {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.1);
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-120vh) rotate(15deg);
                opacity: 0;
            }
        }

        @keyframes twinkle {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }

            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* balloon pop animation */
        @keyframes popBalloon {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.3);
                opacity: 0.8;
            }

            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        @keyframes fallConfetti {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translate(var(--x), var(--y)) scale(0.3);
                opacity: 0;
            }
        }
    </style>
</head>

<body class="flex justify-center items-center flex-col overflow-hidden">
    <audio id="birthdayAudio" autoplay loop>
        <source src="assets/songs/happy-birthday.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="birthday-text" data-aos="fade-in" data-aos-duration="3000">
        Happy Birthday!!!!!!<span style="clear: all">🎂💖</span>
    </div>

    <div id="balloons"></div>

    <div id="stars"></div>

    <!-- confetti -->
    <canvas id="confettiCanvas"
        style="position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9999;"></canvas>

    <script>
        const gifFolder = "assets/video/";
        const gifFiles = [
            "cat-dance-dancing-cat.gif",
            "catshakira-cat.gif",
            "giphy.gif",
            "giphy (1).gif",
            "good-morning.gif",
            "mus8029-cat-dance.gif",
            "1231.gif"
        ];

        let gifsShown = false;

        function showAllGifs() {
            const usedPositions = [];
            const margin = 200; // keeps gifs away from edges

            gifFiles.forEach(file => {
                const gif = document.createElement("img");
                gif.src = gifFolder + file;
                gif.className = "gif-image";

                let x, y;
                let overlapping;

                // Try random positions until one doesn’t overlap
                do {
                    x = Math.random() * (window.innerWidth - 200);
                    y = Math.random() * (window.innerHeight - 200);
                    overlapping = usedPositions.some(pos => {
                        return (
                            Math.abs(pos.x - x) < 160 &&
                            Math.abs(pos.y - y) < 160
                        );
                    });
                } while (overlapping);

                usedPositions.push({ x, y });

                gif.style.left = x + "px";
                gif.style.top = y + "px";

                document.body.appendChild(gif);

                // Fade in smoothly
                setTimeout(() => {
                    gif.style.opacity = "1";
                }, 100);
            });
        }

        // 🎵 Trigger when song reaches 23 seconds
        const audio = document.getElementById("birthdayAudio");
        audio.addEventListener("timeupdate", () => {
            if (audio.currentTime >= 23 && !gifsShown) {
                gifsShown = true;
                showAllGifs();
            }
        });
    </script>
    <script>
        /* --------- Physics confetti emitter (bottom-left & bottom-right) --------- */
        (() => {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');

            // Resize canvas to device pixel ratio for crispness
            function resize() {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = Math.floor(window.innerWidth * dpr);
                canvas.height = Math.floor(window.innerHeight * dpr);
                canvas.style.width = window.innerWidth + 'px';
                canvas.style.height = window.innerHeight + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            window.addEventListener('resize', resize);
            resize();

            // Particle list
            const particles = [];

            // Colors for confetti
            const COLORS = ['#ff4d4d', '#ffd11a', '#66ff66', '#3399ff', '#ff66cc', '#ff7f50', '#8a2be2'];

            // Physics parameters (tweak for different behavior)
            const GRAVITY = 0.1;         // pulls pieces down
            const FALL_GRAVITY = 0.05;    // gravity after peak (to make falling slower)
            const AIR_DRAG = 0.995;       // horizontal drag
            const ROT_DRAG = 0.99;
            const WIND_VARIATION = 0.02;  // small horizontal wind noise
            const MAX_PARTICLES = 900;

            // Particle shape types: 0 = rectangle (strip), 1 = circle
            function rand(a, b) { return a + Math.random() * (b - a); }
            function choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

            class Particle {
                constructor(x, y, vx, vy, size, color, shape) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.size = size;
                    this.color = color;
                    this.shape = shape;
                    this.rotation = rand(0, Math.PI * 2);
                    this.vr = rand(-0.2, 0.2); // rotation speed
                    this.age = 0;
                    this.life = rand(240, 700); // frames until forced removal (safety)
                    this.hasPeaked = false; // detect when vy changes sign (starts to fall)
                    this.opacity = 1;
                }

                update() {
                    // small random wind/air gust
                    this.vx += (Math.random() - 0.5) * WIND_VARIATION;

                    // apply gravity: stronger upward movement uses GRAVITY, when falling use smaller gravity to slow descent
                    if (!this.hasPeaked) {
                        // still going up (vy < 0) - normal gravity
                        this.vy += GRAVITY;
                    } else {
                        // falling - gentler gravity so they float down slowly
                        this.vy += FALL_GRAVITY;
                    }

                    // detect peak (when vertical velocity flips from negative to positive)
                    if (!this.hasPeaked && this.vy > 0) {
                        this.hasPeaked = true;
                        // add a slight random sideways boost on peak for variety
                        this.vx += rand(-0.6, 0.6);
                        this.vr *= 1.5;
                    }

                    // apply drag
                    this.vx *= AIR_DRAG;
                    this.vy *= 0.999; // minor vertical dampening
                    this.rotation += this.vr * ROT_DRAG;

                    // move
                    this.x += this.vx;
                    this.y += this.vy;

                    // fade out near end of life or if low-speed on ground
                    this.age++;
                    if (this.age > this.life * 0.7) {
                        this.opacity = Math.max(0, 1 - (this.age - this.life * 0.7) / (this.life * 0.3));
                    }
                }

                draw(ctx) {
                    ctx.save();
                    ctx.globalAlpha = this.opacity;
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    if (this.shape === 0) {
                        // rectangle confetti strip
                        ctx.fillStyle = this.color;
                        ctx.fillRect(-this.size / 2, -this.size / 6, this.size, this.size / 3);
                    } else {
                        // simple round confetti
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }

                offscreen(w, h) {
                    return (this.x < -50 || this.x > w + 50 || this.y > h + 120 || this.age > this.life);
                }
            }

            // Create a burst of confetti emitted from (x, y)
            // dir: 'left' or 'right' emitter - determines horizontal bias
            function emitBurst(x, y, dir, count = 18) {
                for (let i = 0; i < count; i++) {
                    if (particles.length > MAX_PARTICLES) break;
                    // initial velocity: mostly upward, with horizontal bias depending on emitter side
                    const spread = 0.9; // how wide the cone is
                    const angle = rand(-Math.PI * 0.9 / 2, Math.PI * 0.9 / 2); // angle from upward
                    // base speed between
                    const speed = rand(6, 13); // shoot higher (reaches ~75% screen height)

                    // convert polar to vx,vy: upward = vy negative
                    let vx = Math.sin(angle) * speed;
                    let vy = -Math.cos(angle) * speed;

                    // bias so left emitter pushes to the right and vice versa (like a blower)
                    if (dir === 'left') vx = Math.abs(vx) * rand(0.6, 1.2);
                    if (dir === 'right') vx = -Math.abs(vx) * rand(0.6, 1.2);

                    // slight random offsets so pieces start at different places near the popper
                    const px = x + rand(-12, 18);
                    const py = y + rand(-6, 6);

                    const size = rand(6, 14);
                    const color = choice(COLORS);
                    const shape = Math.random() < 0.7 ? 0 : 1;

                    particles.push(new Particle(px, py, vx, vy, size, color, shape));
                }
            }

            // Emitters at bottom-left and bottom-right
            const emitterLeft = { x: 40, y: window.innerHeight - 40, dir: 'left' };
            const emitterRight = { x: window.innerWidth - 40, y: window.innerHeight - 40, dir: 'right' };

            // Update emitter positions on resize (keep them near corners)
            function updateEmitters() {
                emitterLeft.y = window.innerHeight - 40;
                emitterRight.x = window.innerWidth - 40;
                emitterRight.y = window.innerHeight - 40;
            }
            window.addEventListener('resize', () => {
                updateEmitters();
                resize();
            });

            // Emit piece-by-piece like a blower: small bursts repeatedly
            // returns an interval id you can clear if you want to stop
            function startContinuousEmitter(emitter, burstCount = 8, intervalMs = 120) {
                // keep emitting forever (or until user stops)
                const id = setInterval(() => {
                    emitBurst(emitter.x, emitter.y, emitter.dir, burstCount);
                }, intervalMs);
                return id;
            }

            // Create occasional larger celebratory bursts
            function occasionalBigBurst() {
                // random small delay between big bursts
                const ms = rand(2800, 8000);
                setTimeout(() => {
                    // big burst from both emitters
                    emitBurst(emitterLeft.x, emitterLeft.y, emitterLeft.dir, Math.floor(rand(30, 70)));
                    emitBurst(emitterRight.x, emitterRight.y, emitterRight.dir, Math.floor(rand(30, 70)));
                    occasionalBigBurst();
                }, ms);
            }

            // Auto start
            let burstInterval = setInterval(() => {
                emitBurst(emitterLeft.x, emitterLeft.y, emitterLeft.dir, Math.floor(rand(20, 40)));
                emitBurst(emitterRight.x, emitterRight.y, emitterRight.dir, Math.floor(rand(20, 40)));
            }, 1000);

            // 🕐 Stop shooting completely after 10 seconds
            setTimeout(() => {
                clearInterval(burstInterval);
            }, 10000);

            // Optionally: pop both emitters once when user clicks anywhere (adds playful interaction)
            document.addEventListener('click', (e) => {
                // small localised burst near click too
                emitBurst(e.clientX, e.clientY, Math.random() < 0.5 ? 'left' : 'right', 26);
            });

            // Main animation loop
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const vw = window.innerWidth;
                const vh = window.innerHeight;

                // update particles and draw
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.update();
                    p.draw(ctx);

                    // remove offscreen or dead particles
                    if (p.offscreen(vw, vh)) {
                        particles.splice(i, 1);
                    }
                }

                requestAnimationFrame(animate);
            }

            animate();

            // Public control (optional)
            window.confettiPoppers = {
                emitLeftBurst: (count = 30) => emitBurst(emitterLeft.x, emitterLeft.y, emitterLeft.dir, count),
                emitRightBurst: (count = 30) => emitBurst(emitterRight.x, emitterRight.y, emitterRight.dir, count),
                stop: () => { clearInterval(leftInterval); clearInterval(rightInterval); },
                start: () => {
                    // not strictly necessary since we started automatically
                }
            };

        })();
    </script>

    <script>
        // 🎈 Auto-generate balloons
        const balloonContainer = document.getElementById("balloons");
        const balloonImages = ["1.png", "2.png", "3.png", "4.png", "5.png", "6.png"];

        // Function to create confetti burst 🎉
        function createConfetti(x, y) {
            const colors = ["#ff4d4d", "#ffd11a", "#66ff66", "#3399ff", "#ff66cc"];
            for (let i = 0; i < 10; i++) {
                const confetti = document.createElement("div");
                confetti.className = "confetti";
                confetti.style.left = x + "px";
                confetti.style.top = y + "px";
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];

                // Random scatter direction
                confetti.style.setProperty("--x", (Math.random() - 0.5) * 120 + "px");
                confetti.style.setProperty("--y", (Math.random() - 0.5) * 120 + "px");

                document.body.appendChild(confetti);

                // remove confetti after animation
                setTimeout(() => confetti.remove(), 700);
            }
        }

        function createBalloon() {
            const balloon = document.createElement("img");
            const randomImg = balloonImages[Math.floor(Math.random() * balloonImages.length)];
            balloon.src = `assets/img/balloons/${randomImg}`;
            balloon.className = "balloon";
            balloon.style.left = Math.random() * 90 + "%";
            balloon.style.width = Math.random() * 100 + 100 + "px";
            balloon.style.animationDuration = (8 + Math.random() * 5) + "s";
            balloon.style.animationDelay = Math.random() * 5 + "s";
            balloon.draggable = false;

            // 🎈 Pop effect with confetti
            balloon.addEventListener("click", (e) => {
                const rect = balloon.getBoundingClientRect();
                const x = rect.left + rect.width / 2;

                // shift confetti burst into balloon body (higher, not the string)
                const y = rect.top + rect.height / 8;

                balloon.classList.add("pop");
                createConfetti(x, y);

                setTimeout(() => balloon.remove(), 400);
            });

            balloonContainer.appendChild(balloon);

            setTimeout(() => {
                if (balloon && !balloon.classList.contains("pop")) {
                    balloon.remove();
                }
            }, 15000);
        }

        setInterval(createBalloon, 1200);

        // ✨ Stars
        const starContainer = document.getElementById("stars");
        function createStar() {
            const star = document.createElement("div");
            star.className = "star";
            star.textContent = "✨";
            star.style.left = Math.random() * 100 + "%";
            star.style.top = Math.random() * 100 + "%";
            star.style.fontSize = (10 + Math.random() * 20) + "px";
            starContainer.appendChild(star);

            setTimeout(() => {
                star.remove();
            }, 4000);
        }
        setInterval(createStar, 800);

        // Play birthday song (needed for browsers that block autoplay with sound)
        document.addEventListener("click", () => {
            const audio = document.getElementById("birthdayAudio");
            if (audio.paused) {
                audio.play();
            }
        });
    </script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>

</body>

</html>
