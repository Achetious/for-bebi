<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for bebi</title>
    <link rel="stylesheet" href="assets/src/output.css">
    <link rel="icon" href="assets/img/folder.png" type="image" />
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single+Ink:wght@100..900&display=swap"
        rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>

<body class="flex justify-center items-center flex-col overflow-hidden w-full h-full">
    <div class="cardd h-[500px] max-lg:w-10/12 w-[900px] rounded-2xl bg-[#BDEEF2] mb-14 p-8 shadow-[12px_12px_0px_rgba(107,114,128,1)] flex flex-col justify-center items-center gap-5"
        data-aos="fade-in" data-aos-duration="1500">
        <div class="mb-4 border-b border-gray-200 dark:border-gray-700 w-full md:px-5 px-0" data-aos="fade-down"
            data-aos-duration="1500">
            <ul class="flex flex-wrap -mb-px text-sm font-medium text-center" id="default-styled-tab"
                data-tabs-toggle="#default-styled-tab-content"
                data-tabs-active-classes="text-white hover:text-white dark:text-white dark:hover:text-white border- dark:border-white bg-[#F2BDDE]"
                data-tabs-inactive-classes="dark:border-transparent text-gray-500 hover:text-black border-gray-100 hover:border-[#F2BDDE] dark:border-gray-700 dark:hover:text-[#F2BDDE] cursor-pointer"
                role="tablist">
                <li role="for pristine">
                    <button
                        class="inline-block p-4 border-b-2 rounded-t-lg font-bold text-lg hover:text-[#F2BDDE] hover:border-[#F2BDDE] dark:hover:text-[#F2BDDE]"
                        id="for-bebi-styled-tab" data-tabs-target="#styled-for-bebi" type="button" role="tab"
                        aria-controls="for-bebi" aria-selected="false">to pristine, from friends</button>
                </li>
            </ul>
        </div>
        <div id="default-styled-tab-content" class="w-full" data-aos="fade-up" data-aos-duration="2500">
            <!-- folders/letters -->
            <div class="p-4 rounded-lg h-[375px] overflow-y-auto bg-[#fdfdfd]" id="styled-letters" role="tabpanel"
                aria-labelledby="for-bebi-styled-tab">

                <button id="goBackBtn"
                    class="hidden mb-4 px-4 py-2 bg-[#F2BDDE] text-black rounded-lg hover:bg-[#ff6ac6] cursor-pointer"
                    onclick="showFolders()">
                    ← Go Back
                </button>

                <!-- Grid of folders -->
                <div id="foldersGrid" class="grid grid-cols-2 md:grid-cols-4 lg:gap-16 max-lg:gap-8"></div>

                <!-- Letter content -->
                <div id="folderContent" class="hidden">
                    <h2 id="folderTitle" class="text-2xl font-bold mb-4"></h2>
                    <p id="folderText" class="text-gray-700 text-lg">
                        Content for this day will show here 🎉
                    </p>
                </div>
            </div>
        </div>
    </div>
    <!-- music player -->
    <div class="flex flex-col items-center group/he select-none z-10">
        <!-- Spinning visual -->
        <div class="relative z-0 h-16 -mb-2 transition-all duration-200 group-hover/he:h-0">
            <svg width="128" height="128" viewBox="0 0 128 128"
                class="duration-500 border-4 rounded-full shadow-md border-zinc-400 animate-[spin_3s_linear_infinite]">
                <rect width="128" height="128" fill="black"></rect>
                <circle cx="20" cy="20" r="2" fill="white"></circle>
                <circle cx="40" cy="30" r="2" fill="white"></circle>
                <circle cx="60" cy="10" r="2" fill="white"></circle>
                <circle cx="80" cy="40" r="2" fill="white"></circle>
                <circle cx="100" cy="20" r="2" fill="white"></circle>
                <circle cx="120" cy="50" r="2" fill="white"></circle>
                <circle cx="90" cy="30" r="8" fill="white"></circle>
            </svg>
            <div class="absolute z-10 w-8 h-8 bg-white border-4 rounded-full shadow-sm border-zinc-400 top-12 left-12">
            </div>
        </div>

        <!-- Player body -->
        <div
            class="z-30 flex flex-col w-40 h-20 transition-all duration-300 bg-white shadow-md group-hover/he:h-40 group-hover/he:w-72 rounded-2xl shadow-zinc-400 overflow-visible">

            <!-- Song Info -->
            <div class="flex flex-row w-full h-0 group-hover/he:h-20">
                <div
                    class="relative flex items-center justify-center w-24 h-24 group-hover/he:-top-6 group-hover/he:-left-4 opacity-0 group-hover/he:animate-[spin_3s_linear_infinite] group-hover/he:opacity-100 transition-all duration-100">
                    <svg width="96" height="96" viewBox="0 0 128 128"
                        class="duration-500 border-4 rounded-full shadow-md border-zinc-400">
                        <rect width="128" height="128" fill="black"></rect>
                        <circle cx="20" cy="20" r="2" fill="white"></circle>
                        <circle cx="40" cy="30" r="2" fill="white"></circle>
                        <circle cx="60" cy="10" r="2" fill="white"></circle>
                        <circle cx="80" cy="40" r="2" fill="white"></circle>
                        <circle cx="100" cy="20" r="2" fill="white"></circle>
                        <circle cx="120" cy="50" r="2" fill="white"></circle>
                    </svg>
                    <div
                        class="absolute z-10 w-6 h-6 bg-white border-4 rounded-full shadow-sm border-zinc-400 top-9 left-9">
                    </div>
                </div>

                <div
                    class="flex flex-col justify-center w-full pl-3 -ml-24 overflow-hidden group-hover/he:-ml-3 text-nowrap">
                    <p class="text-sm font-bold">we fell in love in october</p>
                    <p class="text-zinc-600">girl in red</p>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="flex flex-row mx-3 mt-3 bg-indigo-100 rounded-md min-h-4 group-hover/he:mt-0">
                <span id="currentTime" class="hidden pl-3 text-sm text-zinc-600 group-hover/he:inline-block">0:00</span>
                <input id="progressBar" type="range" min="0" max="187" value="0"
                    class="w-24 group-hover/he:w-full flex-grow h-1 mx-2 my-auto bg-[#F2BDDE] rounded-full appearance-none
            [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-3 [&::-webkit-slider-thumb]:h-3
            [&::-webkit-slider-thumb]:bg-white [&::-webkit-slider-thumb]:border-2 [&::-webkit-slider-thumb]:border-zinc-400
            [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:cursor-pointer [&::-webkit-slider-thumb]:shadow-md" />
                <span id="duration" class="hidden pr-3 text-sm text-zinc-600 group-hover/he:inline-block">3:07</span>
            </div>

            <!-- Player Controls -->
            <div
                class="flex flex-row items-center justify-center flex-grow mx-3 space-x-5 z-20 overflow-visible min-h-[48px] group/controls">

                <!-- Repeat / Shuffle -->
                <label for="playMode"
                    class="flex items-center justify-center w-0 opacity-0 cursor-pointer group-hover/he:w-12 group-hover/he:opacity-100 transition-all duration-300 overflow-visible">
                    <input type="checkbox" id="playMode" class="hidden peer/playMode" />
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="#777"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="feather feather-repeat peer-checked/playMode:hidden">
                        <polyline points="17 1 21 5 17 9"></polyline>
                        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                        <polyline points="7 23 3 19 7 15"></polyline>
                        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="#777"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="hidden feather feather-shuffle peer-checked/playMode:inline-block">
                        <polyline points="16 3 21 3 21 8"></polyline>
                        <line x1="4" y1="20" x2="21" y2="3"></line>
                        <polyline points="21 16 21 21 16 21"></polyline>
                        <line x1="15" y1="15" x2="21" y2="21"></line>
                        <line x1="4" y1="4" x2="9" y2="9"></line>
                    </svg>
                </label>

                <!-- Skip Back -->
                <div class="flex items-center justify-center w-12 cursor-pointer overflow-visible">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="feather feather-skip-back">
                        <polygon points="19 20 9 12 19 4 19 20"></polygon>
                        <line x1="5" y1="19" x2="5" y2="5"></line>
                    </svg>
                </div>

                <!-- Play / Pause -->
                <label for="playStatus" class="flex items-center justify-center w-12 cursor-pointer overflow-visible">
                    <input type="checkbox" id="playStatus" class="hidden peer/playStatus" />
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="feather feather-play peer-checked/playStatus:hidden">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="hidden feather feather-pause peer-checked/playStatus:inline-block">
                        <rect x="6" y="4" width="4" height="16"></rect>
                        <rect x="14" y="4" width="4" height="16"></rect>
                    </svg>
                </label>

                <!-- Skip Forward -->
                <div class="flex items-center justify-center w-12 cursor-pointer overflow-visible">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="feather feather-skip-forward">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="5" x2="19" y2="19"></line>
                    </svg>
                </div>

                <!-- Volume Control -->
                <div id="volumeContainer"
                    class="relative flex items-center justify-center w-0 opacity-0 transition-all duration-300 cursor-pointer group-hover/he:w-12 group-hover/he:opacity-100 overflow-visible group/vol">

                    <!-- Volume Icon -->
                    <svg id="volumeIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
                        stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="feather feather-volume-2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>


                    <!-- Floating Volume Slider -->
                    <div
                        class="absolute right-1 translate-x-full bottom-1/2 translate-y-1/2 z-[9999] opacity-0 pointer-events-none group-hover/vol:opacity-100 group-hover/vol:pointer-events-auto transition-all duration-300 overflow-visible">
                        <div
                            class="flex items-center justify-center px-3 py-2 rounded-xl shadow-lg bg-[rgba(255,255,255,0.85)] backdrop-blur-md border border-zinc-200">
                            <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="1" class="w-24 h-1 bg-[#F2BDDE] rounded-full appearance-none 
                            [&::-webkit-slider-thumb]:appearance-none 
                            [&::-webkit-slider-thumb]:w-3 [&::-webkit-slider-thumb]:h-3 
                            [&::-webkit-slider-thumb]:bg-white [&::-webkit-slider-thumb]:border-2 
                            [&::-webkit-slider-thumb]:border-zinc-400 [&::-webkit-slider-thumb]:rounded-full 
                            [&::-webkit-slider-thumb]:cursor-pointer [&::-webkit-slider-thumb]:shadow-md" />
                        </div>
                    </div>
                </div>
            </div>

            <audio id="audioPlayer">
                <source src="assets/songs/mygirl.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

    <!-- music player script -->
    <script>
        const audio = document.getElementById("audioPlayer");
        const playButton = document.getElementById("playStatus");
        const progressBar = document.getElementById("progressBar");
        const currentTimeEl = document.getElementById("currentTime");
        const durationEl = document.getElementById("duration");
        const volumeSlider = document.getElementById("volumeSlider");
        const volumeIcon = document.getElementById("volumeIcon");
        const volumeContainer = document.getElementById("volumeContainer");

        const SONG_DURATION = 187;
        progressBar.max = SONG_DURATION;

        let lastVolume = 1; // store the last volume before mute
        let isMuted = false;

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? "0" : ""}${s}`;
        }

        playButton.addEventListener("change", () => {
            playButton.checked ? audio.play() : audio.pause();
        });

        volumeSlider.addEventListener("input", (e) => {
            audio.volume = e.target.value;
            lastVolume = e.target.value;
            if (audio.volume === 0) isMuted = true;
            else isMuted = false;
        });

        // 🔇 Toggle mute/unmute when clicking the icon
        volumeContainer.addEventListener("click", (e) => {
            if (e.target.id === "volumeSlider") return; // ignore slider clicks

            if (isMuted) {
                audio.volume = lastVolume;
                volumeSlider.value = lastVolume;
                isMuted = false;
                volumeIcon.innerHTML = `
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>`;
            } else {
                lastVolume = audio.volume;
                audio.volume = 0;
                volumeSlider.value = 0;
                isMuted = true;
                volumeIcon.innerHTML = `
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                    <line x1="17" y1="9" x2="23" y2="15"></line>`;
            }
        });

        audio.addEventListener("timeupdate", () => {
            progressBar.value = Math.floor(audio.currentTime);
            currentTimeEl.textContent = formatTime(audio.currentTime);
        });

        progressBar.addEventListener("input", () => {
            audio.currentTime = progressBar.value;
        });

        audio.addEventListener("loadedmetadata", () => {
            durationEl.textContent = formatTime(audio.duration || SONG_DURATION);
        });
    </script>

    <!-- folders script -->
    <script>
        const foldersGrid = document.getElementById("foldersGrid");
        const content = document.getElementById("folderContent");
        const goBackBtn = document.getElementById("goBackBtn");

        let letters = [];

        fetch("assets/json/lettersoffriends.json")
            .then(response => response.json())
            .then(data => {
                letters = data;
                generateFolders();
            });

        function generateFolders() {
            foldersGrid.innerHTML = "";
            letters.forEach((letter, index) => {
                const folder = document.createElement("div");
                folder.className = "relative h-full text-center cursor-pointer hover:scale-105 transition-transform duration-300";
                folder.dataset.index = index;

                folder.innerHTML = `
                    <div class="flex flex-col items-center">
                        <img class="h-full w-full object-cover rounded-lg shadow-md" src="assets/img/folder.png" alt="folder">
                        <p class="mt-2 text-gray-700 font-medium text-center">
                            Letter ${index + 1}
                        </p>
                    </div>
                `;

                folder.addEventListener("click", () => {
                    showLetter(index);
                });

                foldersGrid.appendChild(folder);
            });
        }

        function showLetter(index) {
            const letter = letters[index];
            foldersGrid.classList.add("hidden");
            content.classList.remove("hidden");
            goBackBtn.classList.remove("hidden");

            // Instantly jump to top (no smooth animation)
            const container = document.getElementById("styled-letters");
            container.scrollTop = 0;

            document.getElementById("folderText").innerHTML = `
                <p class="whitespace-pre-line text-gray-800 leading-relaxed">${letter}</p>
            `;
        }

        function showFolders() {
            content.classList.add("hidden");
            goBackBtn.classList.add("hidden");
            foldersGrid.classList.remove("hidden");
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>

</html>
